<!DOCTYPE html>

<html>

<head>

<title>Logs</title>

</head>

<body>

<h1>Security Logs</h1>

<hr>

<table border="1">

<tr>

<th>ID</th>

<th>IP</th>

<th>Attack</th>

<th>Action</th>

<th>Time</th>

</tr>


{% for log in logs %}

<tr>

<td>

{{ log.id }}

</td>

<td>

{{ log.ip_address }}

</td>

<td>

{{ log.attack_type }}

</td>

<td>

{{ log.action }}

</td>

<td>

{{ log.timestamp }}

</td>

</tr>

{% endfor %}


</table>

</body>

</html>
